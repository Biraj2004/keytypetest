    <!-- Structured Data (JSON-LD WebApplication schema) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "KeyType",
        "alternateName": "KeyType Typing Test",
        "url": "https://keytypetest.birajsarkar67.workers.dev/",
        "image": "https://keytypetest.birajsarkar67.workers.dev/icon-512.png",
        "description": "Free online typing speed test — measure your WPM and accuracy in 15, 30, 60, or 120 second tests. No signup required. Works offline.",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "All",
        "inLanguage": "en",
        "browserRequirements": "Requires HTML5, JavaScript, CSS",
        "isAccessibleForFree": true,
        "screenshot": "https://keytypetest.birajsarkar67.workers.dev/icon-512.png",
        "featureList": [
          "15, 30, 60, and 120 second typing tests",
          "Live WPM and accuracy tracking",
          "Results history",
          "Offline-first PWA",
          "No account required"
        ],
        "offers": {
          "@type": "Offer",
          "price": "0.00",
          "priceCurrency": "USD"
        },
        "creator": {
          "@type": "Person",

    <!-- Structured Data (JSON-LD FAQPage schema — enables Google People Also Ask) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "What is a good typing speed (WPM)?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "The average typing speed is around 40 WPM. A good typing speed for everyday use is 60–80 WPM. Professional typists typically reach 80–100 WPM. Anything above 100 WPM is considered fast. Use this free typing test to measure where you stand."
            }
          },
          {
            "@type": "Question",
            "name": "How is WPM calculated?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "WPM (words per minute) is calculated by dividing the number of correctly typed characters by 5 (the standard word length), then dividing by the elapsed time in minutes. KeyType also shows raw WPM — every character typed, correct or not — so you can see your speed vs. accuracy separately."
            }
          },
          {
            "@type": "Question",
            "name": "How can I improve my typing speed?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "The most effective way to improve typing speed is consistent daily practice. Take a 1–2 minute typing test every day, focus on accuracy first (aim for 95%+ accuracy before chasing speed), and avoid looking at the keyboard. Speed follows naturally once your fingers learn the positions."
            }
          },
          {
            "@type": "Question",
            "name": "Is KeyType free to use?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes, KeyType is completely free. No account, no signup, no ads, and no paywalls. Just open the site and start typing. It also works offline after the first load, so you can practise anywhere without an internet connection."
            }
          },
          {
            "@type": "Question",
            "name": "Do I need to create an account?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No account is required. KeyType saves your result history locally in your browser — no data is sent to any server. Your typing history is private and stays on your device."
            }
          },
          {
            "@type": "Question",
            "name": "What typing test durations are available?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "KeyType offers 15, 30, 60, and 120 second typing tests. The 30-second test is great for a quick check. The 60-second test is the most commonly used standard. The 120-second test reveals how well you sustain speed over time."
            }
          },
          {
            "@type": "Question",
            "name": "What is the difference between WPM and raw WPM?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "WPM counts only correctly typed characters. Raw WPM counts every character you typed — right or wrong. The gap between the two shows your error rate. A high raw WPM with low WPM means you are typing fast but making too many mistakes. Aim to keep them close together."
            }
          },
          {
            "@type": "Question",
            "name": "Can I use KeyType offline?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. KeyType is an offline-first progressive web app (PWA). After your first visit, the entire app is cached and runs with no internet connection. You can also install it to your desktop or home screen for instant access."
            }
          }
        ]
      }
    </script>
  </head>
